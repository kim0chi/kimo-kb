services:
  dashboard:
    image: kimo:local
    build:
      context: .
      dockerfile: app/deploy/nuc/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    env_file:
      - /srv/kimo/secrets/server.env
    volumes:
      - ./knowledge:/srv/kimo/knowledge:ro
      - ./content:/srv/kimo/content:ro
      - /srv/kimo/state:/srv/kimo/state
      - /srv/kimo/backups:/srv/kimo/backups
    mem_limit: 1536m
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/deployment').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
